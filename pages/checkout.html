<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — SokoShamba</title>
<meta name="description" content="Complete your SokoShamba order: delivery details, payment method and order review.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5132'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-nav="Marketplace">
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>
<main id="main">
  <section class="page-head">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="marketplace.html">Marketplace</a><span>/</span><a href="cart.html">Cart</a><span>/</span><span>Checkout</span></nav>
      <h1>Checkout</h1>
      <p>Four short steps: delivery details, payment method, review and confirmation.</p>
    </div>
  </section>

  <div class="container" style="padding-block:var(--sp-5) var(--sp-8)">
    <div class="stepper" id="stepper" aria-label="Checkout progress"></div>
    <div class="cart-layout">
      <section id="checkoutStep" aria-live="polite"></section>
      <aside class="summary card card--pad" aria-label="Order summary">
        <h2 style="font-size:var(--fs-md)" class="mb-3">Order summary</h2>
        <div id="summaryItems"></div>
        <div class="divider"></div>
        <div class="summary__row"><span>Subtotal</span><strong id="sumSubtotal">KES 0</strong></div>
        <div class="summary__row"><span>Delivery</span><strong id="sumDelivery">KES 0</strong></div>
        <div class="summary__row total"><span>Total</span><strong id="sumTotal">KES 0</strong></div>
        <p class="small muted mt-4">🔐 Payments are initialised and verified on a secure server. Card details are never
          handled by this frontend.</p>
      </aside>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script type="module" src="../js/app.js"></script>
<script type="module" src="../js/pages/checkout.js"></script>
</body>
</html>
