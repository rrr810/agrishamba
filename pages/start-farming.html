<style>
  .wiz { max-width: 720px; margin-inline: auto; }
  .wiz-progress { display: flex; gap: 6px; margin-bottom: var(--sp-5); }
  .wiz-progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--ink-200); transition: var(--transition); }
  .wiz-progress span.done { background: var(--green-500); }
  .wiz-q { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; color: var(--ink-900); line-height: 1.25; }
  .wiz-sub { color: var(--ink-600); margin-top: 8px; }
  .opt-grid { display: grid; gap: 12px; margin-top: var(--sp-5); }
  .opt {
    display: flex; align-items: center; gap: 14px; padding: 16px 18px; cursor: pointer;
    border: 2px solid var(--border-strong); border-radius: var(--radius); background: var(--surface);
    transition: var(--transition); text-align: left; width: 100%;
  }
  .opt:hover { border-color: var(--green-400); background: var(--green-50); transform: translateX(3px); }
  .opt.sel { border-color: var(--green-600); background: var(--green-50); box-shadow: 0 0 0 1px var(--green-600) inset; }
  .opt__ico { font-size: 1.8rem; flex: none; }
  .opt__t { font-weight: 700; color: var(--ink-900); }
  .opt__d { font-size: var(--fs-xs); color: var(--ink-500); margin-top: 2px; }

  .rec { border: 2px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
  .rec.top { border-color: var(--green-500); box-shadow: 0 8px 28px rgba(21,115,71,.14); }
  .rec__head { padding: var(--sp-5); background: linear-gradient(135deg, var(--green-800), var(--green-600)); color: #fff; }
  .rec.top .rec__head { background: linear-gradient(135deg, #0b4429, #1f9d55); }
  .rec__head h3 { color: #fff; font-size: 1.5rem; margin: 0; }
  .rec__badge { display: inline-block; background: rgba(255,255,255,.2); padding: 4px 12px;
                border-radius: 999px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); margin: var(--sp-4) 0; }
  .money > div { background: var(--surface); padding: 14px; text-align: center; }
  .money .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-500); }
  .money .val { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; margin-top: 4px; }
  .cost-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: var(--fs-sm); }
  .cal { position: relative; padding-left: 26px; }
  .cal li { position: relative; padding-bottom: 18px; }
  .cal li::before { content:''; position:absolute; left:-26px; top:5px; width:11px; height:11px;
                    border-radius:50%; background: var(--green-500); box-shadow: 0 0 0 3px var(--green-100); }
  .cal li::after { content:''; position:absolute; left:-21px; top:18px; bottom:0; width:2px; background: var(--green-100); }
  .cal li:last-child::after { display:none; }
  .pill { display:inline-block; background: var(--green-50); color: var(--green-700); border:1px solid var(--green-100);
          padding: 3px 10px; border-radius:999px; font-size:11px; font-weight:700; }
  @media (max-width: 560px) { .money { grid-template-columns: 1fr; } .wiz-q { font-size: 1.35rem; } }
</style>
