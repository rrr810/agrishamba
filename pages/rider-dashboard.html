<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rider dashboard — SokoShamba</title>
<meta name="description" content="See available delivery jobs, accept them, track pickups on a live map and get paid — for SokoShamba riders and transporters.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5132'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%9A%9B%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/pages.css"><link rel="stylesheet" href="../css/responsive.css">
<style>
  .job-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
              padding: var(--sp-4); transition: var(--transition); display: grid; gap: 8px; position: relative; overflow: hidden; }
  .job-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
              background: var(--ink-200); transition: var(--transition); }
  .job-card:hover { border-color: var(--green-400); box-shadow: var(--shadow); transform: translateY(-2px); }
  .job-card:hover::before { background: var(--green-500); }
  .job-card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .job-card__pay { font-family: var(--font-display); color: var(--green-700); font-size: 1.4rem; font-weight: 800; }
  .job-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; }
  .job-meta span { background: var(--ink-100); padding: 3px 8px; border-radius: 999px; }
  .job-route { display: grid; gap: 4px; font-size: 13px; color: var(--ink-700); padding: 8px 0; border-block: 1px dashed var(--border); }
  .job-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .rider-toggle { display: flex; align-items: center; gap: 12px; padding: var(--sp-4);
                  background: var(--green-50); border: 1px solid var(--green-100); border-radius: var(--radius);
                  transition: var(--transition); }
  .rider-toggle.off { background: var(--ink-100); border-color: var(--border); }
  @keyframes blinkDot { 0%,100%{opacity:1} 50%{opacity:.35} }
  .live-dot { display:inline-block; width:9px; height:9px; border-radius:50%;
              background: var(--green-500); animation: blinkDot 1.6s infinite; margin-right:6px; }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>
<main id="main"><div class="container"><div class="dash">
  <div id="dashSide"></div>
  <div class="dash-main" id="dashRoot" aria-live="polite"></div>
</div></div></main>
<div id="site-footer"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="../js/app.js"></script>
<script type="module">
  import { qs, escapeHtml, toast, setButtonLoading, formatKES, timeAgo, loadingState, modal } from '../js/ui.js';
  import { deliveries } from '../js/api.js';
  import { renderSidebar } from '../js/dashboard.js';
  import { requireRole } from '../js/guards.js';
  import { getSupabase } from '../js/supabase-client.js';
  import { initRiderRouteButtons } from '../js/maps.js';

  const user = await requireRole(['rider'], { mount: '#main' });
  if (!user) throw new Error('blocked');

  qs('#dashSide').outerHTML = renderSidebar(user, 'rider-dashboard.html');
  initRiderRouteButtons();
  await render();

  async function render() {
    const root = qs('#dashRoot');
    root.innerHTML = loadingState('Loading rider dashboard…');

    const sb = await getSupabase();
    const { data: profile } = await sb.from('rider_profiles').select('*').eq('id', user.id).maybeSingle();
    const isAvailable = profile?.is_available ?? true;

    const [availableRes, activeRes, earningsRes] = await Promise.all([
      deliveries.available(), deliveries.myActive(), deliveries.earnings()
    ]);
    const available = availableRes.data || [];
    const active = activeRes.data || [];
    const earn = earningsRes.data || {};
    const county = profile?.active_county || user.county;

    root.innerHTML = `
      <div class="dash-header">
        <div>
          <h1>Rider dashboard 🚛</h1>
          <p class="muted small">Karibu, ${escapeHtml(user.fullName.split(' ')[0])}.
            ${county
              ? `Serving <strong>${escapeHtml(county)}</strong>. <a href="#" id="changeCountyBtn">Change</a>`
              : `<span style="color:var(--danger-600)">⚠️ Set your county to see nearby jobs first</span> — <a href="#" id="changeCountyBtn">Set now</a>`}
          </p>
        </div>
        <a class="btn btn--outline" href="profile.html">Edit rider profile</a>
      </div>

      <div class="rider-toggle ${isAvailable ? '' : 'off'}">
        <span style="font-size:1.4rem" aria-hidden="true">${isAvailable ? '🟢' : '🔴'}</span>
        <div style="flex:1">
          <strong>${isAvailable ? `<span class="live-dot"></span>You are ONLINE` : 'You are OFFLINE'}</strong>
          <p class="small muted">${isAvailable ? 'Available jobs appear below the moment buyers order.' : 'Go online to receive delivery jobs.'}</p>
        </div>
        <button class="btn ${isAvailable ? 'btn--outline' : 'btn--primary'}" id="toggleBtn">
          ${isAvailable ? 'Go offline' : 'Go online'}
        </button>
      </div>

      <div class="stat-grid mt-5">
        <div class="stat"><p class="stat__label">Available now</p><p class="stat__value">${available.length}</p><p class="stat__meta">Jobs waiting</p></div>
        <div class="stat stat--info"><p class="stat__label">In progress</p><p class="stat__value">${active.length}</p><p class="stat__meta">Jobs you accepted</p></div>
        <div class="stat stat--gold"><p class="stat__label">Pending earnings</p><p class="stat__value">${formatKES(earn.pending)}</p><p class="stat__meta">Held until buyer confirms</p></div>
        <div class="stat"><p class="stat__label">Total earned</p><p class="stat__value">${formatKES(earn.released)}</p><p class="stat__meta">${earn.jobs || 0} jobs</p></div>
      </div>

      <section class="card mt-5">
        <div class="card__head"><h2>🔥 Available jobs</h2>
          <button class="btn btn--outline btn--sm" id="refreshBtn">↻ Refresh</button></div>
        <div class="card__body">${renderAvailable(available)}</div>
      </section>

      <section class="card mt-5" id="activeDeliveriesCard">
        <div class="card__head"><h2>📦 My active deliveries</h2></div>
        <div class="card__body">${renderActive(active)}</div>
      </section>`;

    qs('#toggleBtn').addEventListener('click', async (e) => {
      setButtonLoading(e.currentTarget, true, '…');
      await sb.from('rider_profiles')
        .update({ is_available: !isAvailable, updated_at: new Date().toISOString() })
        .eq('id', user.id);
      toast(isAvailable ? 'You are now offline.' : 'You are online — jobs will appear!', 'success');
      render();
    });

    qs('#refreshBtn').addEventListener('click', render);

    qs('#changeCountyBtn')?.addEventListener('click', async (e) => {
      e.preventDefault();
      const { COUNTIES } = await import('../js/config.js');
      modal({
        title: 'Which county do you serve?',
        body: `<p class="small mb-3">Jobs from your county appear at the top of your list.</p>
          <div class="field"><label for="cSelect">County</label>
          <select class="select" id="cSelect"><option value="">Select county</option>
          ${COUNTIES.map((c) => `<option value="${c}" ${c === county ? 'selected' : ''}>${c}</option>`).join('')}
          </select></div>`,
        actions: [
          { label: 'Cancel', variant: 'btn--outline' },
          { label: 'Save', variant: 'btn--primary', onClick: async (close, root2) => {
            const val = root2.querySelector('#cSelect').value;
            if (!val) return toast('Please pick a county.', 'warn');
            await sb.from('rider_profiles')
              .update({ active_county: val, updated_at: new Date().toISOString() })
              .eq('id', user.id);
            toast(`County set to ${val}.`, 'success');
            close();
            render();
          }}
        ]
      });
    });

    document.body.addEventListener('click', handleJobAction);
  }

  function renderAvailable(jobs) {
    if (!jobs.length) return `
      <div class="state">
        <div class="state__icon" aria-hidden="true">🕓</div>
        <h3>No jobs available right now</h3>
        <p>Jobs appear here as soon as buyers place orders that need delivery.</p>
        <button class="btn btn--outline mt-3" onclick="location.reload()">🔄 Check again</button>
      </div>`;

    const nearby = jobs.filter((j) => j.isNearby).length;
    const other = jobs.length - nearby;

    return `
      <p class="small muted mb-3">
        ${nearby ? `<strong style="color:var(--green-700)">📍 ${nearby} nearby</strong>` : ''}
        ${nearby && other ? ' · ' : ''}${other ? `${other} in other counties` : ''}
      </p>
      <div class="grid gap-3">${jobs.map((j) => {
        const o = j.orders;
        const items = (o.items || []).map((i) => `${i.qty} × ${escapeHtml(i.name_snapshot)}`).join(', ');
        return `<div class="job-card" ${j.isNearby ? 'style="border-color:var(--green-400)"' : ''}>
          <div class="job-card__head">
            <div>
              <strong>${escapeHtml(o.reference)}</strong>
              ${j.isNearby ? '<span class="badge badge--green" style="margin-left:6px">📍 Nearby</span>' : ''}
              <div class="job-meta mt-2">
                <span>🚛 ${escapeHtml(j.vehicle_type || 'boda')}</span>
                <span>📦 ${Number(j.weight_kg || 0)}kg</span>
                <span>📍 ~${Number(j.distance_km || 0)}km</span>
                <span>🕐 ${timeAgo(j.created_at)}</span>
              </div>
            </div>
            <div style="text-align:right">
              <p class="job-card__pay">${formatKES(j.rider_earns)}</p>
              <p class="small muted">total ${formatKES(j.fee_total)}</p>
            </div>
          </div>
          <div class="job-route">
            <div>📤 <strong>Pick up:</strong> ${escapeHtml(j.pickup_location || '')}, <strong>${escapeHtml(j.pickup_county || '')}</strong></div>
            <div>📥 <strong>Deliver:</strong> ${escapeHtml(o.address?.line || '')}, ${escapeHtml(o.address?.town || '')}, <strong>${escapeHtml(j.dropoff_county || '')}</strong></div>
            <div class="small muted">📦 ${escapeHtml(items)}</div>
          </div>
          <div class="job-actions">
            <button class="btn btn--primary btn--block" data-accept="${j.id}">✅ Accept (${formatKES(j.rider_earns)})</button>
          </div>
        </div>`;
      }).join('')}</div>`;
  }

  function renderActive(jobs) {
    if (!jobs.length) return `<p class="small muted">No active deliveries. Accept a job above to get started.</p>`;

    const next = {
      accepted:  { label: '📤 Picked up from seller', action: 'pickup' },
      picked_up: { label: '📥 Delivered to buyer',    action: 'deliver' },
      delivered: { label: '⏳ Waiting for buyer to confirm', action: null }
    };

    return `<div class="grid gap-3">${jobs.map((j) => {
      const o = j.orders;
      const na = next[j.status];
      const buyerPhone = (o.buyer?.phone || '').replace(/[^\d]/g, '');
      const sellerPhone = (o.seller?.phone || '').replace(/[^\d]/g, '');
      return `<div class="job-card">
        <div class="job-card__head">
          <div>
            <strong>${escapeHtml(o.reference)}</strong>
            <span class="badge badge--info" style="margin-left:6px">${escapeHtml(j.status.replace('_', ' '))}</span>
            <div class="job-meta mt-2">
              <span>💰 ${formatKES(j.rider_earns)}</span>
              <span>📍 ${Number(j.distance_km || 0)}km</span>
            </div>
          </div>
        </div>
        <div class="job-route">
          <div>👨‍🌾 <strong>Seller:</strong> ${escapeHtml(o.seller?.full_name || '—')}
            ${sellerPhone ? ` · <a href="tel:+${sellerPhone}">📞 Call</a> · <a href="https://wa.me/${sellerPhone}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}</div>
          <div>🛒 <strong>Buyer:</strong> ${escapeHtml(o.buyer?.full_name || o.address?.name || '—')}
            ${buyerPhone ? ` · <a href="tel:+${buyerPhone}">📞 Call</a> · <a href="https://wa.me/${buyerPhone}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}</div>
          <div>📤 From: ${escapeHtml(j.pickup_location || '')}, ${escapeHtml(j.pickup_county || '')}</div>
          <div>📥 To: ${escapeHtml(o.address?.line || '')}, ${escapeHtml(o.address?.town || '')}</div>
        </div>
        <div class="job-actions">
          ${na?.action
            ? `<button class="btn btn--primary" data-${na.action}="${j.id}">${na.label}</button>`
            : `<span class="badge badge--warn">${na?.label || 'Awaiting confirmation'}</span>`}
          <button class="btn btn--outline" data-route="${j.id}"
            data-pickup="${escapeHtml(j.pickup_county || '')}"
            data-pickup-loc="${escapeHtml(j.pickup_location || '')}"
            data-dropoff="${escapeHtml(j.dropoff_county || '')}"
            data-dropoff-loc="${escapeHtml(o.address?.town || '')}">🗺️ Route</button>
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  async function handleJobAction(e) {
    const accept = e.target.closest('[data-accept]');
    const pickup = e.target.closest('[data-pickup]');
    const deliver = e.target.closest('[data-deliver]');

    if (accept) {
      setButtonLoading(accept, true, 'Accepting…');
      const { error } = await deliveries.accept(accept.dataset.accept);
      if (error) { setButtonLoading(accept, false); return toast(error.message, 'error'); }
      toast('Job accepted! Contact the seller for pickup.', 'success');
      render();
    }
    if (pickup) {
      setButtonLoading(pickup, true, '…');
      const { error } = await deliveries.markPickedUp(pickup.dataset.pickup);
      if (error) { setButtonLoading(pickup, false); return toast(error.message, 'error'); }
      toast('Marked as picked up. Head to delivery!', 'success');
      render();
    }
    if (deliver) {
      setButtonLoading(deliver, true, '…');
      const { error } = await deliveries.markDelivered(deliver.dataset.deliver);
      if (error) { setButtonLoading(deliver, false); return toast(error.message, 'error'); }
      toast('Delivered! Buyer will confirm receipt.', 'success');
      render();
    }
  }
</script>
</body>
</html>
