<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rider Logistics Hub — SokoShamba</title>
<meta name="description" content="Manage produce pickup and delivery jobs across Kenya with live route tracking.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5132'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/pages.css"><link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.5; }
}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>
<main id="main">
  <div class="container" style="padding-block:var(--sp-4) var(--sp-8)">
    <div id="riderRoot"></div>
  </div>
</main>
<div id="site-footer"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="../js/app.js"></script>
<script type="module">
  import { store } from '../js/state.js';
  import { formatKES, formatNumber, formatDate, escapeHtml, toast, confirmDialog } from '../js/ui.js';

  const KENYA_COORDS = {
    'Nairobi': [-1.286389, 36.817223],
    'Uasin Gishu': [0.514277, 35.26978],
    'Eldoret': [0.514277, 35.26978],
    'Moiben': [0.8167, 35.3833],
    'Nakuru': [-0.303099, 36.080025],
    'Naivasha': [-0.7172, 36.4310],
    'Njoro': [-0.3396, 35.9416],
    'Kiambu': [-1.1714, 36.8356],
    'Ruaka': [-1.2056, 36.7778],
    'Thika': [-1.0333, 37.0694],
    'Machakos': [-1.5177, 37.2634],
    'Mombasa': [-4.0435, 39.6682],
    'Kisumu': [-0.0917, 34.768]
  };

  function getCoords(name, fallback = [-1.286389, 36.817223]) {
    if (!name) return fallback;
    const clean = String(name).toLowerCase();
    for (const [key, coords] of Object.entries(KENYA_COORDS)) {
      if (clean.includes(key.toLowerCase())) return coords;
    }
    return fallback;
  }

  function renderMap(container, { pickupLoc, dropoffLoc, isDelivered, isPickedUp, riderName }) {
    if (!container || !window.L) return;
    const pCoords = getCoords(pickupLoc, [0.514277, 35.26978]);
    const dCoords = getCoords(dropoffLoc, [-1.286389, 36.817223]);

    const mapId = 'map-' + Math.random().toString(36).substr(2, 9);
    container.innerHTML = `<div id="${mapId}" style="width:100%;height:300px;border-radius:10px;border:1px solid #cbd5e1"></div>`;

    try {
      const map = L.map(mapId, { zoomControl: false, attributionControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

      const farmIcon = L.divIcon({
        html: `<div style="background:#0f5132;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,0.3);border:2px solid #fff">🧑‍🌾</div>`,
        iconSize: [32, 32], iconAnchor: [16, 16]
      });

      const buyerIcon = L.divIcon({
        html: `<div style="background:#2563eb;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,0.3);border:2px solid #fff">🏠</div>`,
        iconSize: [32, 32], iconAnchor: [16, 16]
      });

      const riderIcon = L.divIcon({
        html: `<div style="background:#10b981;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 0 0 6px rgba(16,185,129,0.35);border:2px solid #fff;">🛵</div>`,
        iconSize: [36, 36], iconAnchor: [18, 18]
      });

      L.marker(pCoords, { icon: farmIcon }).addTo(map).bindPopup(`<strong>Pickup:</strong> ${pickupLoc}`);
      L.marker(dCoords, { icon: buyerIcon }).addTo(map).bindPopup(`<strong>Delivery to:</strong> ${dropoffLoc}`);

      const progress = isDelivered ? 1 : isPickedUp ? 0.65 : 0.2;
      const rLat = pCoords[0] + (dCoords[0] - pCoords[0]) * progress;
      const rLon = pCoords[1] + (dCoords[1] - pCoords[1]) * progress;
      const riderMarker = L.marker([rLat, rLon], { icon: riderIcon }).addTo(map).bindPopup(`<strong>Rider:</strong> ${riderName}`);

      const polyline = L.polyline([pCoords, dCoords], { color: '#0f5132', weight: 4, opacity: 0.8, dashArray: '8, 8' }).addTo(map);
      map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

      if (isPickedUp && !isDelivered) {
        let step = 0;
        setInterval(() => {
          step = (step + 1) % 100;
          const prog = 0.5 + Math.sin(step * 0.1) * 0.15;
          riderMarker.setLatLng([pCoords[0] + (dCoords[0] - pCoords[0]) * prog, pCoords[1] + (dCoords[1] - pCoords[1]) * prog]);
        }, 800);
      }
    } catch (_) {}
  }

  const root = document.getElementById('riderRoot');

  function renderRiderHub() {
    const user = store.getUser() || { fullName: 'Kevin Kipchirchir', accountType: 'rider', county: 'Uasin Gishu & Nairobi', phone: '+254740793959' };
    
    const allOrders = store.getOrders() || [];
    const rawJobs = localStorage.getItem('sokoshamba:delivery-jobs');
    let allJobs = rawJobs ? JSON.parse(rawJobs) : [];

    allOrders.forEach(o => {
      let existing = allJobs.find(j => j.order_id === o.id || j.id === o.id);
      if (!existing) {
        existing = {
          id: 'JOB-' + String(o.id).replace(/[^\d]/g, ''),
          order_id: o.id,
          status: o.status === 'Rider Assigned' ? 'accepted' :
                  o.status === 'Out for Delivery' ? 'picked_up' :
                  o.status === 'Delivered' || o.status === 'Confirmed by Buyer' ? 'delivered' : 'available',
          vehicle_type: 'Pickup / Boda',
          distance_km: 25,
          weight_kg: 50,
          fee_total: o.delivery || 1200,
          rider_earns: Math.round((o.delivery || 1200) * 0.9),
          pickup_county: o.items?.[0]?.county || 'Uasin Gishu',
          pickup_location: (o.items?.[0]?.county || 'Uasin Gishu') + ' Farm Depot',
          dropoff_county: o.address?.county || 'Nairobi',
          dropoff_location: o.address?.town || o.address?.line || 'Buyer Location',
          orders: o
        };
        allJobs.unshift(existing);
      } else {
        existing.orders = o;
        if (o.status === 'Rider Assigned') existing.status = 'accepted';
        if (o.status === 'Out for Delivery') existing.status = 'picked_up';
        if (o.status === 'Delivered' || o.status === 'Confirmed by Buyer') existing.status = 'delivered';
      }
    });

    localStorage.setItem('sokoshamba:delivery-jobs', JSON.stringify(allJobs));

    const activeJobs = allJobs.filter(j => ['accepted', 'picked_up', 'out_for_delivery'].includes(j.status));
    const availableJobs = allJobs.filter(j => j.status === 'available');
    const completedJobs = allJobs.filter(j => ['delivered', 'confirmed'].includes(j.status));
    const totalEarned = completedJobs.reduce((s, j) => s + (Number(j.rider_earns) || 1200), 0);

    root.innerHTML = `
      <div class="dash-header flex justify-between items-center wrap gap-3 mb-5">
        <div>
          <h1 style="font-size:var(--fs-xl)">Rider Logistics Hub 🛵</h1>
          <p class="muted small">${escapeHtml(user.fullName)} · Active Delivery Area: <strong>${escapeHtml(user.county || 'Nairobi & Rift Valley')}</strong></p>
        </div>
        <div class="flex gap-2 items-center">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#10b981;box-shadow:0 0 0 4px rgba(16,185,129,0.3);animation:pulseDot 1.5s infinite"></span>
          <span class="badge badge--green" style="font-size:13px;padding:6px 14px">🟢 GPS Live &amp; Online</span>
        </div>
      </div>

      <div class="stat-grid mb-6">
        <div class="stat"><p class="stat__label">Total Earned</p><p class="stat__value">${formatKES(totalEarned)}</p><p class="stat__meta">Completed trips</p></div>
        <div class="stat stat--info"><p class="stat__label">Available Payout</p><p class="stat__value">${formatKES(totalEarned)}</p><p class="stat__meta">Ready for instant M-Pesa</p></div>
        <div class="stat ${activeJobs.length ? 'stat--gold' : ''}"><p class="stat__label">Active Deliveries</p><p class="stat__value">${activeJobs.length}</p><p class="stat__meta">In transit</p></div>
        <div class="stat stat--info"><p class="stat__label">Available Jobs</p><p class="stat__value">${availableJobs.length}</p><p class="stat__meta">Incoming buyer orders</p></div>
      </div>

      <!-- ACTIVE DELIVERY TRIP (GLOVO LIVE TRACKING) -->
      <section class="card mb-6" style="border:2px solid var(--green-600);background:#fff">
        <div class="card__head" style="background:var(--green-50)">
          <h2>🛵 My Active Delivery Trip (${activeJobs.length})</h2>
          <span class="badge ${activeJobs.length ? 'badge--green' : ''}">${activeJobs.length ? 'Live On Road' : 'Standby'}</span>
        </div>
        <div class="card__body">
          ${activeJobs.length ? activeJobs.map(j => {
            const isPickedUp = ['picked_up', 'out_for_delivery', 'delivered'].includes(j.status);
            const isDelivered = j.status === 'delivered';
            const orderRef = j.order_id || j.orders?.reference || 'Order';
            const buyer = j.orders?.address || j.orders?.buyer || {};
            const seller = j.orders?.seller || {};

            return `
            <div class="mb-4">
              <div class="flex justify-between items-center wrap gap-2 mb-3">
                <div>
                  <strong style="font-size:var(--fs-md)">Trip ${escapeHtml(j.id)} · Order ${escapeHtml(orderRef)}</strong>
                  <p class="small muted">Vehicle: <strong>${escapeHtml(j.vehicle_type || 'Pickup / Boda')}</strong> · Payout: <strong style="color:var(--green-800)">${formatKES(j.rider_earns || 1350)}</strong></p>
                </div>
                <div>
                  <span class="badge ${isDelivered ? 'badge--green' : isPickedUp ? 'badge--info' : 'badge--warn'}">
                    ${isDelivered ? '🎯 Delivered' : isPickedUp ? '🛵 On the Way to Buyer' : '🧑‍🌾 Heading to Farm'}
                  </span>
                </div>
              </div>

              <div class="grid-2 gap-4 mb-4">
                <div style="background:#f8fafc;padding:16px;border-radius:10px;border-left:4px solid var(--green-700)">
                  <div class="flex justify-between items-center mb-2">
                    <strong style="color:var(--green-900)">1. Farm Pickup (Seller)</strong>
                    ${isPickedUp ? '<span class="badge badge--green">✅ Picked Up</span>' : '<span class="badge badge--warn">Pending Pickup</span>'}
                  </div>
                  <p class="small">
                    <strong>Farmer: ${escapeHtml(seller.full_name || 'Joseph Kiptoo')}</strong><br>
                    📍 ${escapeHtml(j.pickup_location || 'Moiben Farm Depot')}, ${escapeHtml(j.pickup_county || 'Uasin Gishu')}<br>
                    📞 ${escapeHtml(seller.phone || '+254 712 345 001')}
                  </p>
                  <div class="flex gap-2 mt-3">
                    <a class="btn btn--outline btn--sm" href="tel:${escapeHtml(seller.phone || '+254712345001')}">📞 Call Farmer</a>
                    ${!isPickedUp ? `<button class="btn btn--primary btn--sm" data-btn-pickup="${j.id}">✅ Confirm Pickup from Farm</button>` : ''}
                  </div>
                </div>

                <div style="background:#f8fafc;padding:16px;border-radius:10px;border-left:4px solid var(--primary-600)">
                  <div class="flex justify-between items-center mb-2">
                    <strong style="color:var(--primary-900)">2. Buyer Drop-off</strong>
                    ${isDelivered ? '<span class="badge badge--green">✅ Delivered</span>' : isPickedUp ? '<span class="badge badge--info">On the Way 🛵</span>' : '<span class="badge badge--warn">Next Step</span>'}
                  </div>
                  <p class="small">
                    <strong>Buyer: ${escapeHtml(buyer.name || buyer.full_name || 'Buyer')}</strong><br>
                    📍 ${escapeHtml(j.dropoff_location || 'Buyer Address')}, ${escapeHtml(j.dropoff_county || 'Nairobi')}<br>
                    📞 ${escapeHtml(buyer.phone || '+254 712 345 002')}
                  </p>
                  <div class="flex gap-2 mt-3">
                    <a class="btn btn--outline btn--sm" href="tel:${escapeHtml(buyer.phone || '+254712345002')}">📞 Call Buyer</a>
                    ${isPickedUp && !isDelivered ? `<button class="btn btn--primary btn--sm" data-btn-deliver="${j.id}">🎯 Confirm Delivery to Buyer</button>` : ''}
                  </div>
                </div>
              </div>

              <div class="mt-4">
                <div id="mapMount-${j.id}"></div>
              </div>
            </div>`;
          }).join('') : `
            <div style="padding:28px;text-align:center">
              <div style="font-size:2.5rem" aria-hidden="true">🛵</div>
              <h3 class="mt-2">No active trip right now</h3>
              <p class="small muted mt-1">Accept an incoming order from the available jobs pool below.</p>
            </div>`}
        </div>
      </section>

      <!-- AVAILABLE JOBS POOL -->
      <section class="card mb-6">
        <div class="card__head">
          <h2>📦 Available Delivery Jobs Pool (${availableJobs.length})</h2>
          <span class="badge badge--green">Live Incoming Orders</span>
        </div>
        <div class="card__body">
          ${availableJobs.length ? `
            <div class="grid gap-4">
              ${availableJobs.map(j => `
                <div class="card card--pad" style="border-left:4px solid var(--green-600);box-shadow:var(--shadow-sm);background:#fff">
                  <div class="flex justify-between items-center wrap gap-2 mb-3">
                    <div>
                      <strong>Job ${escapeHtml(j.id)}</strong> · <span class="badge badge--light">${escapeHtml(j.vehicle_type || 'Pickup / Boda')}</span>
                      <span class="badge badge--green ml-2">📍 New Order Placed</span>
                    </div>
                    <div class="price" style="font-size:var(--fs-lg);color:var(--green-800)">
                      ${formatKES(j.rider_earns || 1350)} <small style="font-size:12px;color:var(--ink-500)">payout</small>
                    </div>
                  </div>

                  <div class="grid-2 gap-3 small mb-4">
                    <div><span class="muted">📍 Pickup:</span> <strong>${escapeHtml(j.pickup_location)}, ${escapeHtml(j.pickup_county)}</strong></div>
                    <div><span class="muted">🏁 Drop-off:</span> <strong>${escapeHtml(j.dropoff_location)}, ${escapeHtml(j.dropoff_county)}</strong></div>
                    <div><span class="muted">🛣️ Est. Distance:</span> <strong>${j.distance_km || 25} km</strong></div>
                    <div><span class="muted">⚖️ Cargo:</span> <strong>~${j.weight_kg || 50} kg produce</strong></div>
                  </div>

                  <div class="flex justify-between items-center wrap gap-2 pt-3" style="border-top:1px solid var(--border-light)">
                    <span class="small muted">Order: <strong>${escapeHtml(j.order_id || j.orders?.reference || 'Order')}</strong></span>
                    <button class="btn btn--primary btn--lg" data-btn-accept="${j.id}">
                      Accept Delivery Job (${formatKES(j.rider_earns || 1350)})
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <div style="padding:28px;text-align:center">
              <p class="muted">Waiting for new buyer orders. When a buyer places an order in checkout, it pops up here live!</p>
            </div>`}
        </div>
      </section>
    `;

    setTimeout(() => {
      activeJobs.forEach(j => {
        const mapEl = document.getElementById(`mapMount-${j.id}`);
        if (mapEl) {
          renderMap(mapEl, {
            pickupLoc: j.pickup_location || j.pickup_county,
            dropoffLoc: j.dropoff_location || j.dropoff_county,
            isDelivered: j.status === 'delivered',
            isPickedUp: j.status === 'picked_up' || j.status === 'out_for_delivery',
            riderName: user.fullName || 'Kevin Kipchirchir'
          });
        }
      });
    }, 50);

    document.querySelectorAll('[data-btn-accept]').forEach(btn => {
      btn.addEventListener('click', () => {
        const jobId = btn.dataset.btnAccept;
        btn.disabled = true;
        btn.innerHTML = 'Claiming…';

        const raw = localStorage.getItem('sokoshamba:delivery-jobs');
        let list = raw ? JSON.parse(raw) : [];
        const job = list.find(j => j.id === jobId);
        if (job) {
          job.status = 'accepted';
          job.rider_id = user.id;
          localStorage.setItem('sokoshamba:delivery-jobs', JSON.stringify(list));

          const order = store.getOrder(job.order_id);
          if (order) {
            const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
            const timeline = order.timeline || [];
            timeline.push({ label: `Rider assigned (${user.fullName})`, at: now });
            store.updateOrder(job.order_id, {
              status: 'Rider Assigned',
              riderName: user.fullName,
              riderPhone: user.phone || '+254740793959',
              timeline
            });
          }
        }

        toast('🎉 Delivery Job Claimed! Proceed to farm pickup.', 'success');
        renderRiderHub();
      });
    });

    document.querySelectorAll('[data-btn-pickup]').forEach(btn => {
      btn.addEventListener('click', () => {
        const jobId = btn.dataset.btnPickup;
        btn.disabled = true;
        btn.innerHTML = 'Updating…';

        const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
        const raw = localStorage.getItem('sokoshamba:delivery-jobs');
        let list = raw ? JSON.parse(raw) : [];
        const job = list.find(j => j.id === jobId);
        if (job) {
          job.status = 'picked_up';
          job.pickup_at = now;
          localStorage.setItem('sokoshamba:delivery-jobs', JSON.stringify(list));

          const order = store.getOrder(job.order_id);
          if (order) {
            const timeline = order.timeline || [];
            timeline.push({ label: 'Produce picked up by rider · Out for delivery 🚚', at: now });
            store.updateOrder(job.order_id, {
              status: 'Out for Delivery',
              timeline
            });
          }
        }

        toast('📦 Marked as Picked Up! Buyer can now track your live GPS route.', 'success');
        renderRiderHub();
      });
    });

    document.querySelectorAll('[data-btn-deliver]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const jobId = btn.dataset.btnDeliver;
        const yes = await confirmDialog({
          title: 'Confirm Delivery',
          message: 'Have you handed over the produce safely to the buyer?',
          confirmLabel: 'Yes, Delivered'
        });
        if (!yes) return;

        btn.disabled = true;
        btn.innerHTML = 'Confirming…';

        const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
        const raw = localStorage.getItem('sokoshamba:delivery-jobs');
        let list = raw ? JSON.parse(raw) : [];
        const job = list.find(j => j.id === jobId);
        if (job) {
          job.status = 'delivered';
          job.delivered_at = now;
          localStorage.setItem('sokoshamba:delivery-jobs', JSON.stringify(list));

          const order = store.getOrder(job.order_id);
          if (order) {
            const timeline = order.timeline || [];
            timeline.push({ label: 'Rider delivered produce · Awaiting buyer confirmation 🎯', at: now });
            store.updateOrder(job.order_id, {
              status: 'Delivered',
              timeline
            });
          }
        }

        toast('🎯 Delivery Completed! Buyer prompted to confirm receipt.', 'success');
        renderRiderHub();
      });
    });
  }

  // Cross-tab live synchronization
  store.subscribe((event) => {
    if (['orders', 'delivery-jobs'].includes(event)) {
      toast('🔔 Real-Time Order Update Received!', 'info');
      renderRiderHub();
    }
  });

  window.addEventListener('storage', () => {
    renderRiderHub();
  });

  renderRiderHub();
</script>
</body>
</html>
