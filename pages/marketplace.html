<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace — SokoShamba</title>
<meta name="description" content="Browse produce, livestock, seeds, fertilizer, feed and farm equipment from sellers across Kenya.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5132'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-nav="Marketplace">
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>
<main id="main">
  <section class="page-head">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="../index.html">Home</a><span>/</span><span>Marketplace</span></nav>
      <h1>Marketplace</h1>
      <p>Produce, inputs, livestock and equipment from farmers, cooperatives and agrovets across Kenya.</p>
    </div>
  </section>

  <div class="container">
    <div class="market-layout">
      <aside class="filters card card--pad" id="filterPanel" aria-label="Product filters">
        <div class="flex items-center justify-between">
          <h2 style="font-size:var(--fs-md)">Filters</h2>
          <button class="btn btn--ghost btn--sm" id="clearFilters" type="button">Clear all</button>
        </div>
        <div class="filters__group">
          <h4 id="catLabel">Category</h4>
          <div id="categoryFilters" role="group" aria-labelledby="catLabel"></div>
        </div>
        <div class="filters__group">
          <h4><label for="countyFilter">County</label></h4>
          <select class="select" id="countyFilter"><option value="">All counties</option></select>
        </div>
        <div class="filters__group">
          <h4>Price range (KES)</h4>
          <div class="grid-2" style="gap:10px">
            <div class="field" style="margin:0"><label class="sr-only" for="minPrice">Minimum price</label>
              <input class="input" id="minPrice" type="number" min="0" placeholder="Min" inputmode="numeric"></div>
            <div class="field" style="margin:0"><label class="sr-only" for="maxPrice">Maximum price</label>
              <input class="input" id="maxPrice" type="number" min="0" placeholder="Max" inputmode="numeric"></div>
          </div>
          <button class="btn btn--outline btn--sm btn--block mt-3" id="applyPrice" type="button">Apply price</button>
        </div>
        <div class="filters__group">
          <h4>Seller</h4>
          <label class="filter-option"><input type="checkbox" id="verifiedOnly"> Verified sellers only</label>
          <label class="filter-option"><input type="checkbox" id="inStockOnly"> In stock only</label>
        </div>
      </aside>

      <section aria-label="Products">
        <div class="market-toolbar">
          <div class="search-box">
            <label class="sr-only" for="searchInput">Search products</label>
            <input class="input" id="searchInput" type="search" placeholder="Search maize, tomatoes, DAP, dairy heifer…">
          </div>
          <button class="btn btn--outline filters-toggle" id="filtersToggle" type="button" aria-expanded="false" aria-controls="filterPanel">Filters</button>
          <div>
            <label class="sr-only" for="sortSelect">Sort by</label>
            <select class="select" id="sortSelect">
              <option value="newest">Newest first</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="rating">Best rated</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
        </div>
        <div class="chips mb-4" id="activeChips" aria-live="polite"></div>
        <p class="small muted mb-3" id="resultCount" aria-live="polite"></p>
        <div id="productResults"></div>
        <div class="mt-6 text-center" id="loadMoreWrap" hidden>
          <button class="btn btn--outline" id="loadMoreBtn" type="button">Load more products</button>
        </div>
        <nav class="pagination mt-5" id="pagination" aria-label="Pagination"></nav>
      </section>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script type="module" src="../js/app.js"></script>
<script type="module" src="../js/pages/marketplace.js"></script>
</body>
</html>
