<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — SokoShamba</title>
<meta name="description" content="Set a new password for your SokoShamba account.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5132'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>
<main id="main">
  <div class="auth-wrap">
    <section class="auth-visual">
      <h2>Choose a strong new password.</h2>
      <p>Use at least 8 characters with a mix of letters, numbers and symbols. Avoid reusing passwords from other services.</p>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <h1>New password</h1>
        <p class="muted mb-5" id="subText">Verifying your reset link…</p>

        <div id="linkStatus"></div>

        <form id="resetForm" novalidate hidden>
          <div id="formAlert" role="alert" aria-live="assertive"></div>
          <div class="field">
            <label for="password">New password <span class="req" aria-hidden="true">*</span></label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
              <button type="button" class="input-affix" data-toggle-password="password" aria-label="Show password">👁</button>
            </div>
            <div class="strength" id="strength" data-level="0" aria-live="polite">
              <div class="strength__bars"><span></span><span></span><span></span><span></span></div>
              <p class="strength__text">Password strength</p>
            </div>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm new password <span class="req" aria-hidden="true">*</span></label>
            <div class="input-group">
              <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
              <button type="button" class="input-affix" data-toggle-password="confirmPassword" aria-label="Show password">👁</button>
            </div>
          </div>
          <button class="btn btn--primary btn--block btn--lg" type="submit">Update password</button>
        </form>

        <p class="auth-alt"><a href="login.html">Back to login</a></p>
      </div>
    </section>
  </div>
</main>
<div id="site-footer"></div>
<script type="module" src="../js/app.js"></script>
<script type="module">
  import { getSupabase } from '../js/supabase-client.js';
  import { qs, qsa, toast, setButtonLoading, escapeHtml } from '../js/ui.js';
  import { auth } from '../js/auth.js';

  const form = qs('#resetForm');
  const statusBox = qs('#linkStatus');
  const subText = qs('#subText');

  qsa('[data-toggle-password]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.togglePassword);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁';
    });
  });

  const pwInput = qs('#password');
  const meter = qs('#strength');
  pwInput.addEventListener('input', () => {
    const { score, label } = auth.passwordStrength(pwInput.value);
    meter.dataset.level = pwInput.value ? String(score) : '0';
    meter.querySelector('.strength__text').textContent =
      pwInput.value ? `Password strength: ${label}` : 'Password strength';
  });

  async function verifyLink() {
    const sb = await getSupabase();
    if (!sb) {
      statusBox.innerHTML = `<div class="alert alert--error"><span>⛔</span>
        <div>Cannot reach the authentication service. Check your connection.</div></div>`;
      subText.textContent = '';
      return;
    }

    const hash = new URLSearchParams(window.location.hash.slice(1));
    const errDesc = hash.get('error_description') || hash.get('error');
    if (errDesc) {
      statusBox.innerHTML = `<div class="alert alert--error"><span>⛔</span>
        <div><strong>This link is invalid or has expired.</strong><br>${escapeHtml(errDesc)}</div></div>
        <a class="btn btn--primary btn--block mt-3" href="forgot-password.html">Request a new link</a>`;
      subText.textContent = '';
      return;
    }

    for (let i = 0; i < 12; i++) {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        subText.textContent = 'Link verified. Choose your new password below.';
        statusBox.innerHTML = '';
        form.hidden = false;
        return;
      }
      await new Promise((r) => setTimeout(r, 500));
    }

    statusBox.innerHTML = `<div class="alert alert--warn"><span>⚠️</span>
      <div><strong>No active reset session found.</strong> Open the reset link directly from your email,
      or request a fresh one below.</div></div>
      <a class="btn btn--primary btn--block mt-3" href="forgot-password.html">Request a new link</a>`;
    subText.textContent = '';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = form.elements.password.value;
    const cpw = form.elements.confirmPassword.value;
    const alertBox = qs('#formAlert');
    alertBox.innerHTML = '';

    if (pw.length < 8) {
      alertBox.innerHTML = `<div class="alert alert--error"><span>⛔</span><div>Password must be at least 8 characters.</div></div>`;
      return;
    }
    if (pw !== cpw) {
      alertBox.innerHTML = `<div class="alert alert--error"><span>⛔</span><div>The passwords do not match.</div></div>`;
      return;
    }

    const btn = form.querySelector('button[type="submit"]');
    setButtonLoading(btn, true, 'Updating…');

    try {
      const sb = await getSupabase();
      const result = await Promise.race([
        sb.auth.updateUser({ password: pw }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('Request timed out. Please try again.')), 20000))
      ]);
      setButtonLoading(btn, false);

      if (result.error) {
        alertBox.innerHTML = `<div class="alert alert--error"><span>⛔</span><div>${escapeHtml(result.error.message)}</div></div>`;
        return;
      }

      form.hidden = true;
      subText.textContent = '';
      statusBox.innerHTML = `<div class="alert alert--success"><span>✅</span>
        <div><strong>Password updated!</strong> You can now sign in with your new password.</div></div>
        <a class="btn btn--primary btn--block mt-3" href="login.html">Go to login</a>`;
      toast('Password updated successfully.', 'success');
    } catch (err) {
      setButtonLoading(btn, false);
      alertBox.innerHTML = `<div class="alert alert--error"><span>⛔</span><div>${escapeHtml(err.message)}</div></div>`;
    }
  });

  verifyLink();
</script>
</body>
</html>
