<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify your email — SokoShamba</title>
<meta name="description" content="Confirm your email address to activate your SokoShamba account.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5132'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/main.css"><link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/forms.css"><link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="site-header"></div>
<main id="main">
  <section class="section">
    <div class="container" style="max-width:620px">
      <div class="card card--pad text-center" id="verifyRoot">
        <div class="spinner" style="margin-inline:auto"></div>
        <p class="mt-3 muted">Checking your account status…</p>
      </div>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script type="module" src="../js/app.js"></script>
<script type="module">
  import { auth } from '../js/auth.js';
  import { store } from '../js/state.js';
  import { isDemo } from '../js/config.js';
  import { qs, escapeHtml, toast, setButtonLoading, modal } from '../js/ui.js';

  const root = qs('#verifyRoot');
  const params = new URLSearchParams(window.location.hash.slice(1) || window.location.search);
  const urlError = params.get('error_description') || params.get('error');

  async function render() {
    await auth.ready();
    const user = store.getUser();

    if (urlError) {
      root.innerHTML = `
        <div style="font-size:3rem" aria-hidden="true">⛔</div>
        <h1 class="mt-3" style="font-size:var(--fs-2xl)">Verification failed</h1>
        <p class="lead mt-2">${escapeHtml(urlError)}</p>
        <div class="form-actions" style="justify-content:center">
          <a class="btn btn--primary" href="login.html">Back to login</a>
          <a class="btn btn--outline" href="register.html">Register again</a>
        </div>`;
      return;
    }

    if (user) {
      root.innerHTML = `
        <div style="font-size:3rem" aria-hidden="true">✅</div>
        <h1 class="mt-3" style="font-size:var(--fs-2xl)">You're all set!</h1>
        <p class="lead mt-2">Welcome to SokoShamba, ${escapeHtml(user.fullName.split(' ')[0])}.</p>
        <p class="muted small mt-3">Taking you to your dashboard…</p>`;
      setTimeout(() => { location.href = 'dashboard.html'; }, 1600);
      return;
    }

    root.innerHTML = `
      <div style="font-size:3rem" aria-hidden="true">📧</div>
      <h1 class="mt-3" style="font-size:var(--fs-2xl)">Check your email</h1>
      <p class="lead mt-2">We've sent a confirmation link to your inbox. Click the link to activate your account and sign in.</p>
      <p class="muted small mt-4">Can't find it? Check your spam or promotions folder.</p>
      <div class="form-actions" style="justify-content:center">
        <button class="btn btn--primary" id="resendBtn">Resend verification email</button>
        <a class="btn btn--outline" href="login.html">Back to login</a>
      </div>`;

    qs('#resendBtn').addEventListener('click', async (e) => {
      const emailInput = await new Promise((resolve) => {
        modal({
          title: 'Resend verification email',
          body: `<div class="field"><label for="resendEmail">Your email address</label>
                 <input class="input" id="resendEmail" type="email" placeholder="you@example.com"></div>`,
          actions: [
            { label: 'Cancel', variant: 'btn--outline', onClick: (c) => { c(); resolve(null); } },
            { label: 'Send link', variant: 'btn--primary', onClick: (c, r) => {
              const v = r.querySelector('#resendEmail').value.trim();
              c(); resolve(v || null);
            }}
          ]
        });
      });
      if (!emailInput) return;
      setButtonLoading(e.currentTarget, true, 'Sending…');
      const { error } = await auth.resendVerification(emailInput);
      setButtonLoading(e.currentTarget, false);
      if (error) return toast(error.message, 'error');
      toast('Verification email sent. Check your inbox.', 'success');
    });
  }

  store.subscribe((event) => { if (event === 'user') render(); });
  render();
</script>
</body>
</html>
